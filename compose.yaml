name: mycodex-relay

services:
  relay:
    image: mycodex-relay:${MYCODEX_RELAY_VERSION:-dev}
    build:
      context: .
      args:
        VERSION: ${MYCODEX_RELAY_VERSION:-dev}
        REVISION: ${MYCODEX_RELAY_REVISION:-local}
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:${MYCODEX_RELAY_PORT:-38443}:38443"
    volumes:
      - ./docker/relay-config.json:/etc/mycodex-relay/relay-config.json:ro
      - relay-data:/var/lib/mycodex-relay
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  relay-data:
